# ============================================================================
# cv.toml : the ONLY place CV content lives. Layout is in cv.tex.
#
# Inline markup in any text field:  **bold**  *italic*  `code`  [label](url)
# LaTeX special characters (& % $ # _) are escaped for you, just type them.
# Dates must be quoted strings: "2024-11", "2026-09-19", "2022", "present".
#
# Languages: the first language under [languages] (en) is the default and its
# text is the plain key. Another language's text sits right beside it as
# `<key>_<code>`:   title = "Skills"   /   title_id = "Keahlian"
# Lists work the same way: `bullets` / `bullets_id` (same length and order;
# priorities are read from the English list). Anything without a translation
# falls back to English. Run `./build.py --missing` to see what is left.
# Names, URLs and dates need no translation (months come from [languages]).
#
# priority (on any item, section, or bullet; default 1):
#   1 = essential   2 = nice to have   3 = only on the full CV
# Each variant below keeps everything with priority <= its max_priority.
# Items appear in the order written here. Reorder freely.
# ============================================================================

# Output: dist/<variant filename><language suffix>.pdf
[variants.full]
max_priority = 3
