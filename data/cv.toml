Engineer full-stack dan backend yang bekerja dengan **TypeScript, Next.js, Go, dan PostgreSQL**, \
memprogram sejak usia 10 tahun. Paling tertarik pada internal sistem (compiler, runtime, tooling \
low-level) dan pada menghubungkan cara berpikir itu dengan arsitektur produk.
"""

